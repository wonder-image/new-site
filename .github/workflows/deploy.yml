name: 🚀 Deploy

on:
  push:
    branches:
      - main
  # Lancio manuale da GitHub (Actions > 🚀 Deploy > Run workflow)
  # o con `gh workflow run deploy.yml`.
  workflow_dispatch:

# Due deploy sulla stessa branch non girano mai insieme: due sync FTP in
# parallelo corrompono .ftp-deploy-sync-state.json. Il secondo aspetta.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web-deploy:
    name: 🎯 Deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # I secret (BWS_ACCESS_TOKEN, APP_DEPLOY_TOKEN) stanno solo negli step che
    # li usano: npm ci e composer install girano prima e non li vedono.
    env:
      DEPLOY_APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      FORCE_WWW: ${{ vars.FORCE_WWW }}
    steps:

      # Action pinnate per SHA (un tag si può spostare): la versione è nel commento.
      - name: 🚚 Get latest code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 📦 Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 📦 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: gd
          coverage: none
          tools: composer

      - name: 📦 Strumenti di sistema
        run: |
          command -v jq >/dev/null && command -v unzip >/dev/null && exit 0
          sudo apt-get update
          sudo apt-get install -y jq unzip

      # Le dipendenze si installano prima di caricare i secret: uno script di
      # install compromesso non trova credenziali nell'ambiente.
      - name: 📦 Installa Pacchetti PHP
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction

      - name: 📦 Installa Pacchetti JS
        run: npm ci

      - name: 🔎 Controllo sintassi PHP
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n 50 -P 4 php -l -d display_errors=stderr > /dev/null

      - name: 🏷️ Versione assets
        shell: bash
        env:
          ASSETS_VERSION_VAR: ${{ vars.ASSETS_VERSION }}
        run: |
          set -euo pipefail
          # vars.ASSETS_VERSION, altrimenti il valore di .env.example
          version="${ASSETS_VERSION_VAR:-}"
          if [ -z "$version" ] && [ -f .env.example ]; then
            version="$(sed -n 's/^ASSETS_VERSION=//p' .env.example | tr -d "\"'\r" | head -n1)"
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::ASSETS_VERSION non valida: '$version'"; exit 1; }
          [ -d "assets/$version" ] || { echo "::error::La cartella assets/$version non esiste: allinea vars.ASSETS_VERSION."; exit 1; }
          echo "DEPLOY_ASSETS_VERSION=$version" >> "$GITHUB_ENV"

      # CSS e JS del sito minificati sul posto (non quelli della lib, già minificati).
      # Disattivabile con vars.DEPLOY_MINIFY=false.
      - name: 🗜️ Minifica CSS e JS
        if: vars.DEPLOY_MINIFY != 'false'
        run: bash .github/scripts/minify-assets.sh "assets/$DEPLOY_ASSETS_VERSION"

      # Varianti responsive + WebP delle immagini statiche, come per gli upload.
      # Misure: vars.RESPONSIVE_IMAGE_SIZES (es. "480,960,1920"), default del framework.
      # Disattivabile con vars.DEPLOY_IMAGE_VARIANTS=false.
      - name: 🖼️ Varianti immagini (resize + WebP)
        if: vars.DEPLOY_IMAGE_VARIANTS != 'false'
        env:
          RESPONSIVE_IMAGE_SIZES: ${{ vars.RESPONSIVE_IMAGE_SIZES }}
        run: php .github/scripts/image-variants.php "assets/$DEPLOY_ASSETS_VERSION/images"

      - name: 📦 Install Bitwarden Secrets Manager CLI
        run: |
          curl -fLso bws.zip https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.0.0/bws-x86_64-unknown-linux-gnu-2.0.0.zip
          echo "a8340ce01da609200441f2eca0e591173e124f012c88a16afda574279c052013  bws.zip" | sha256sum -c -
          unzip -o bws.zip
          chmod +x bws
          sudo mv bws /usr/local/bin/bws
          rm bws.zip
          bws --version

      - name: 🔐 Load secrets + generate .env
        shell: bash
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_PROJECT_ID: ${{ secrets.BWS_PROJECT_ID }}
          APP_DEPLOY_TOKEN: ${{ secrets.APP_DEPLOY_TOKEN }}
          TRUST_PROXY_VAR: ${{ vars.APP_TRUST_PROXY }}
        run: |
          set -euo pipefail

          umask 077
          : > .env

          secrets_json="$(bws secret list "$BWS_PROJECT_ID")"

          # Secret obbligatori: meglio fermarsi qui che caricare un sito senza DB.
          missing=""
          for key in FTP_HOST FTP_USER FTP_PASSWORD FTP_REMOTE_PATH DB_HOSTNAME DB_USERNAME DB_PASSWORD DB_DATABASE; do
            jq -e --arg k "$key" 'any(.[]; .key == $k and (.value // "") != "")' <<<"$secrets_json" >/dev/null || missing="$missing $key"
          done
          [ -z "$missing" ] || { echo "::error::Secret mancanti nel project Bitwarden:$missing"; exit 1; }

          # Maschera, esporta in $GITHUB_ENV e scrive .env con i valori quotati
          # per phpdotenv (spazi, #, $, virgolette e a capo non rompono più il sito).
          bash .github/scripts/secrets-to-env.sh .env <<<"$secrets_json"

          # Host canonico: www solo se il sito forza www (DEPLOY_FORCE_WWW, lo
          # stesso di forge build), così APP_URL e la chiamata di update evitano il 301
          # (una POST/XHR cross-origin che lo riceve viene bloccata da CORS).
          # Senza FORCE_WWW si resta sul dominio nudo: un sottodominio come
          # shop.esempio.it non ha il certificato per www.shop.esempio.it.
          app_domain="${DEPLOY_APP_DOMAIN#http://}"
          app_domain="${app_domain#https://}"
          app_domain="${app_domain%%/*}"
          app_domain="${app_domain#www.}"
          [ -n "$app_domain" ] || { echo "Missing APP_DOMAIN"; exit 1; }
          # Senza vars.FORCE_WWW: www per il dominio principale, no per un
          # sottodominio (stesso default di forge provision).
          force_www="$(printf '%s' "${FORCE_WWW:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$force_www" in
            true|false) ;;
            "")
              labels="$(printf '%s' "$app_domain" | awk -F. '{print NF}')"
              base=2
              case "$app_domain" in
                *.co.uk|*.org.uk|*.ac.uk|*.gov.uk|*.com.au|*.net.au|*.org.au|*.co.nz|*.com.br|*.co.jp|*.co.za|*.com.mx|*.com.ar|*.com.tr) base=3 ;;
              esac
              if [ "$labels" -gt "$base" ]; then force_www=false; else force_www=true; fi
              ;;
            *)
              echo "::error::vars.FORCE_WWW non valida (usa true o false)."
              exit 1
              ;;
          esac
          echo "DEPLOY_FORCE_WWW=${force_www}" >> "$GITHUB_ENV"

          if [ "$force_www" = "true" ]; then
            canonical_app_domain="www.${app_domain}"
          else
            canonical_app_domain="${app_domain}"
          fi
          echo "APP_CANONICAL_HOST=${canonical_app_domain}" >> "$GITHUB_ENV"

          cat >> .env <<EOF

          APP_DEBUG=false
          APP_DOMAIN=${app_domain}
          APP_URL=https://${canonical_app_domain}

          ASSETS_VERSION=${DEPLOY_ASSETS_VERSION}

          DB_CONNECTION_LOG=0

          EOF

          # APP_DEPLOY_TOKEN deve finire nel .env di produzione perché
          # /api/app/update/ lo legge da $_ENV per autorizzare la richiesta
          # del workflow (deploy bootstrap bypass del flow JWT). Il secret
          # arriva dal blocco env di questo step.
          if [ -n "${APP_DEPLOY_TOKEN:-}" ]; then
            echo "::add-mask::$APP_DEPLOY_TOKEN"
            printf 'APP_DEPLOY_TOKEN=%s\n' "$APP_DEPLOY_TOKEN" >> .env
          else
            echo "::warning::APP_DEPLOY_TOKEN secret non impostato: lo step 'Update App' fallirà."
          fi

          # APP_TRUST_PROXY non è un segreto: arriva dalla variabile del repo
          # (vars.APP_TRUST_PROXY); un valore già presente in BWS ha la precedenza.
          trust_proxy="$(printf '%s' "${TRUST_PROXY_VAR:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -n "$trust_proxy" ] && ! grep -q '^APP_TRUST_PROXY=' .env; then
            case "$trust_proxy" in
              1|true|on|yes|0|false|off|no)
                printf 'APP_TRUST_PROXY=%s\n' "$trust_proxy" >> .env
                ;;
              *)
                echo "::error::vars.APP_TRUST_PROXY non valida (usa true o false)."
                exit 1
                ;;
            esac
          fi

      - name: Normalize FTP path
        shell: bash
        run: |
          set -euo pipefail
          
          path="${FTP_REMOTE_PATH:-}"
          [ -n "$path" ] || { echo "Missing FTP_REMOTE_PATH"; exit 1; }

          [[ "$path" != */ ]] && path="${path}/"

          echo "::add-mask::$path"
          printf 'FTP_REMOTE_PATH=%s\n' "$path" >> "$GITHUB_ENV"

      - name: 🧱 Build static files (handler/index.php, .htaccess)
        run: php forge build $( [ "$DEPLOY_FORCE_WWW" = "true" ] && echo --force-www )

      - name: 🔖 Marker di deploy (wonder-image.json)
        shell: bash
        run: |
          set -euo pipefail

          printf '{"generator":"wonder-image","repo":"%s","commit":"%s","branch":"%s","run":%s,"deployedAt":"%s"}\n' \
            "${GITHUB_REPOSITORY#*/}" "${GITHUB_SHA:0:7}" "${GITHUB_REF_NAME}" "${GITHUB_RUN_ID}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > wonder-image.json

      # vars.FTP_PROTOCOL=ftps se l'hosting lo supporta: con ftp la password
      # viaggia in chiaro.
      - name: 📂 Sincronizza file FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
            protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
            server: ${{ env.FTP_HOST }}
            username: ${{ env.FTP_USER }}
            password: ${{ env.FTP_PASSWORD }}
            port: ${{ env.FTP_PORT }}
            server-dir: ${{ env.FTP_REMOTE_PATH }}
            local-dir: ./
            exclude: |
              **/.git*
              **/.git*/**
              **/.github*
              **/.github/**
              **/.vscode/**
              .devcontainer/**
              **/composer.json
              **/composer.lock
              **/package.json
              **/package-lock.json
              **/node_modules/**
              forge
              *.md
              docs/**
              .gitignore
              .npmrc
              .nvmrc
              .env.example
              state/**
              **/*.log
              skills-lock.json
              tests/**

      # Riallinea la zona Cloudflare (php forge cloudflare:security): non blocca il deploy
      - name: ☁️ Cloudflare
        if: vars.APP_PROXY == 'cloudflare'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN assente nel project Bitwarden: step saltato."
            exit 0
          fi

          # Il comando esiste solo con wonder-image/app aggiornato nel composer.lock
          if ! php forge list --raw | grep -q '^cloudflare:security '; then
            echo "::warning::php forge cloudflare:security non disponibile: aggiorna wonder-image/app."
            exit 0
          fi

          php forge cloudflare:security --no-interaction --domain "$APP_CANONICAL_HOST"

      - name: 🗄️ Update App
        shell: bash
        env:
          APP_DEPLOY_TOKEN: ${{ secrets.APP_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          # Fallback al vecchio nome per non rompere siti che ancora hanno
          # GITHUB_API_TOKEN nel .env locale ma non hanno ancora rilanciato
          # `forge provision` aggiornato.
          deploy_token="${APP_DEPLOY_TOKEN:-${GITHUB_API_TOKEN:-}}"

          if [ -z "$deploy_token" ]; then
            echo "::error::Manca il secret APP_DEPLOY_TOKEN nei GitHub Secrets della repo."
            echo "::error::Generalo con: php forge provision (locale)"
            echo "::error::Oppure manualmente: gh secret set APP_DEPLOY_TOKEN --repo <owner>/<repo> --body \"\$(php -r 'echo bin2hex(random_bytes(32));')\""
            exit 1
          fi

          # `-fsS` nasconde il body in caso di error HTTP. Lo togliamo e
          # gestiamo manualmente: catturiamo body + status, li stampiamo,
          # poi falliamo lo step se status >= 400. Così il messaggio JSON
          # restituito da /api/app/update/ (anche in caso di 500 con
          # exception interna) finisce nei log dell'Action.
          response_body=$(mktemp)
          status=$(curl -sS --retry 3 --retry-all-errors \
            -o "$response_body" -w '%{http_code}' \
            -X POST "https://${APP_CANONICAL_HOST}/api/app/update/" \
            -H "Authorization: Bearer $deploy_token" \
            -H "Content-Type: application/json" \
            -d "{\"release_id\":\"$GITHUB_SHA\",\"source\":\"github\"}" \
            || echo '000')

          echo "HTTP status: $status"
          echo "--- response body ---"
          cat "$response_body" || true
          echo
          echo "--- end response body ---"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Update App ha risposto $status. Controlla il body sopra per il dettaglio dell'errore."
            exit 1
          fi